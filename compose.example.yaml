# Copy to compose.yaml and configure your private server.json.
services:
  message-redirect:
    build:
      context: ./backend
    image: message-redirect:0.2.0
    container_name: message-redirect
    restart: unless-stopped
    ports:
      - "${SMS_BIND_ADDRESS:-127.0.0.1}:18081:18081"
    user: "${SMS_UID:-1026}:${SMS_GID:-100}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./.secrets/server.json:/run/secrets/server.json:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=16m]
    mem_limit: 256m
    networks:
      sms:
        ipv4_address: 172.30.40.2
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18081/health', timeout=5).read()"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 15s
networks:
  sms:
    name: message-redirect
    ipam:
      config:
        - subnet: 172.30.40.0/28
