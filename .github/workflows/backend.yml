name: Backend checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r server/requirements.txt httpx
      - run: python -m unittest discover -s server/tests -p 'test_*.py' -v
      - run: |
          cd deploy
          python ../scripts/init-secrets.py
          for template in compose*.example.yaml; do
            docker compose --env-file .env.example -f "$template" config --quiet
          done
  containers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [sqlite, postgresql, mysql, mariadb]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/test-containers.py --engines "${{ matrix.engine }}"
