# SQLite: copy to compose.yaml; generate .secrets/api-token before starting.
services:
  message-redirect:
    build: ../server
    image: message-redirect:local
    restart: unless-stopped
    ports:
      - "${SMS_BIND_ADDRESS:-127.0.0.1}:${SMS_HTTP_PORT:-18081}:18081"
    environment:
      SMS_ADMIN_PASSWORD_FILE: /run/secrets/admin-password
      SMS_STATE_DIR: /data
      SMS_PUBLIC_URL: ${SMS_PUBLIC_URL:-}
      SMS_DB_TYPE: sqlite
      SMS_DB_PATH: /data/messages.sqlite3
      SMS_API_TOKEN_FILE: /run/secrets/api-token
    secrets: [admin-password, api-token]
    volumes: [sms-data:/data]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=16m]
    mem_limit: 256m
secrets:
  admin-password:
    file: ./.secrets/admin-password
  api-token:
    file: ./.secrets/api-token
volumes:
  sms-data:
